name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first — no point finishing a run
# whose commit is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches [tool.ruff] target-version = "py311" in pyproject.toml.
          python-version: "3.11"
          cache: pip

      - name: Install
        # The package itself plus the [dev] extra (pytest + ruff). The test suite
        # needs the real dependencies because it imports clockwork and drives the
        # actual pages through Streamlit's AppTest.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Test
        # No browser and no server: the suite runs Streamlit in-process via
        # st.testing.v1.AppTest, so a plain runner is enough. Coverage is
        # REPORTED, not gated: the listing of untested lines is the point.
        # GPU-marked tests skip themselves on this runner (no CUDA).
        run: >-
          python -m pytest -q
          --cov=clockwork
          --cov-report=term-missing:skip-covered
